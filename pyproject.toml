[project]
name = "transcriber"
version = "0.1.0"
description = "Scrape Web content into markdown"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Daniel Souza", email = "me@posix.dev.br" },
]
dependencies = [
  "urllib3>=1.26.18,<2",
  "markdownify>=0.11.6,<0.12",
  "beautifulsoup4>=4.11.1,<5",
  "PyYAML>=6.0,<7",
  "rich>=13.3.1,<14",
]

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]
